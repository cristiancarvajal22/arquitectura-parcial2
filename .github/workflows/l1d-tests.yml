name: Pruebas L1D

on:
  push:
    branches:
      - feature/marcelo/cache-l1d
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  l1d:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Probar L1D
        run: node --test tests/unit/l1d.test.mjs
