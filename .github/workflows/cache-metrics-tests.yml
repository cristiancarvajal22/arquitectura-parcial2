name: Pruebas métricas cache

on:
  push:
    branches:
      - feature/marcelo/cache-metricas
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Probar métricas
        run: node --test tests/unit/cache-metrics.test.mjs
